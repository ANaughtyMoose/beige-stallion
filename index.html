<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Beige Stallion</title>
<style>
  :root { --night:#0d1526; --parchment:#efe6d2; --brass:#c9a35b; --muted:#a99f8a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--night); color:var(--parchment);
         font-family: Georgia, "Times New Roman", serif; display:flex; align-items:center; }
  main { width:100%; max-width:640px; margin:0 auto; padding:48px 20px; }
  .kicker { font:500 12px/1 ui-monospace, Menlo, monospace; letter-spacing:.25em; color:var(--brass); text-transform:uppercase; }
  h1 { font-weight:400; font-size:clamp(40px, 11vw, 72px); line-height:1.02; margin:14px 0 8px; }
  .dates { font:400 14px/1 ui-monospace, Menlo, monospace; letter-spacing:.3em; color:var(--muted); }
  p { font-style:italic; font-size:19px; line-height:1.5; color:#d8cfbb; margin:28px 0 36px; }
  a.card { display:block; text-decoration:none; color:inherit; border:1px solid rgba(201,163,91,.45);
           padding:22px 22px; margin:0 0 14px; transition:border-color .3s, background .3s; }
  a.card:hover, a.card:focus-visible { border-color:var(--brass); background:rgba(201,163,91,.06); outline:none; }
  .card .t { font-size:24px; }
  .card .s { font:400 12px/1.4 ui-monospace, Menlo, monospace; letter-spacing:.15em; color:var(--muted); text-transform:uppercase; margin-top:6px; }
  .soon { opacity:.55; pointer-events:none; }
</style>
</head>
<body>
<main>
  <div class="kicker">In memoriam</div>
  <h1>The Beige Stallion.</h1>
  <div class="dates">2000 to 2026</div>
  <p>Two tributes, built from the same story, the same photographs and the same brief. Pick one.</p>
  <a class="card" href="claude/"><div class="t">Version C</div><div class="s">Built by Claude</div></a>
  <a class="card soon" id="g" href="gemini/"><div class="t">Version G</div><div class="s">Built by Gemini, coming soon</div></a>
</main>
</body>
</html>
